<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rolex Oyster Perpetual | Gerçek Katmanlı Ayrılma</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b1926;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    /* 400vh Sanal Kaydırma Alanı */
    #scrollContainer {
      position: relative;
      width: 100%;
      height: 400vh;
    }

    /* Sabit Görünüm Sahnesi */
    .viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #5a9fd4 0%, #29608a 45%, #102942 75%, #07121d 100%);
    }

    .water-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30vh;
      background: linear-gradient(to bottom, rgba(41, 96, 138, 0.2) 0%, rgba(7, 18, 29, 0.95) 90%);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 1;
    }

    /* Üst Başlık */
    .top-header {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    .top-header h1 {
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 700;
    }

    .top-header p {
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-top: 4px;
      font-weight: 500;
    }

    /* SAAT SAHNESİ */
    .watch-stage {
      position: relative;
      width: 320px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    /* GERÇEK PARÇA KATMANLARI */
    .watch-part {
      position: absolute;
      left: 50%;
      top: 50%;
      pointer-events: none;
      will-change: transform;
      transform-origin: center center;
      transform: translate3d(-50%, -50%, 0);
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
      object-fit: contain;
    }

    /* Katman Genişlikleri ve Z-Index Sıralaması */
    #part-kordon    { width: 270px; z-index: 10; }
    #part-conta     { width: 235px; z-index: 20; }
    #part-kasa      { width: 280px; z-index: 30; }
    #part-mekanizma { width: 285px; z-index: 40; }
    #part-kadran    { width: 245px; z-index: 50; }
    #part-ibreler   { width: 215px; z-index: 60; }
    #part-cam       { width: 255px; z-index: 70; }

    /* Alt Durum Çubuğu */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      border-radius: 2px;
    }

    .status-text {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    .scroll-hint {
      position: absolute;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9.5px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      animation: pulse 1.6s infinite;
      pointer-events: none;
      z-index: 90;
      transition: opacity 0.3s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.9; }
      50% { transform: translate(-50%, 6px); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="water-line"></div>

    <div class="top-header">
      <h1>Rolex Oyster Perpetual</h1>
      <p id="stateSubtitle">BİRLEŞİK MONTAJLI SAAT</p>
    </div>

    <!-- 7 AYRI GERÇEK PARÇA KATMANI -->
    <div class="watch-stage" id="watchStage">
      
      <!-- 1. KORDON (En Altta) -->
      <img id="part-kordon" class="watch-part" 
           src="kordon.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068042.png';}" 
           alt="Paslanmaz Çelik Kordon">

      <!-- 2. SU GEÇİRMEZ CONTA -->
      <img id="part-conta" class="watch-part" 
           src="conta.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068044.png';}" 
           alt="Su Geçirmez Conta">

      <!-- 3. OYSTER KASA -->
      <img id="part-kasa" class="watch-part" 
           src="kasa.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068039.png';}" 
           alt="Oyster Kasa">

      <!-- 4. KALİBRE MEKANİZMA -->
      <img id="part-mekanizma" class="watch-part" 
           src="mekanizma.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068045.png';}" 
           alt="Kalibre Mekanizma">

      <!-- 5. KADRAN -->
      <img id="part-kadran" class="watch-part" 
           src="kadran.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068038.png';}" 
           alt="Özel Kadran">

      <!-- 6. İBRELER -->
      <img id="part-ibreler" class="watch-part" 
           src="ibreler.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068040.png';}" 
           alt="Akrep ve Yelkovan">

      <!-- 7. SAFİR KRİSTAL CAM (En Üstte) -->
      <img id="part-cam" class="watch-part" 
           src="cam.png" 
           onerror="if(!this.dataset.r){this.dataset.r=1;this.src='1000068037.png';}" 
           alt="Safir Kristal Cam">

    </div>

    <div class="scroll-hint" id="scrollHint">
      Aşağı Kaydırın ↓
    </div>

    <div class="bottom-bar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="status-text" id="statusText">BİRLEŞİK (%0)</span>
    </div>

  </div>

  <div id="scrollContainer"></div>

  <script>
    // -------------------------------------------------------------
    // FİZİKSEL 3D AYRILMA MOTORU (60 / 120 FPS PÜRÜZSÜZ LERP)
    // -------------------------------------------------------------
    const parts = [
      { el: document.getElementById('part-cam'),       initY: -15, explodeY: -225, initScale: 0.95, explodeScale: 1.02 },
      { el: document.getElementById('part-ibreler'),   initY: -5,  explodeY: -140, initScale: 0.95, explodeScale: 1.01 },
      { el: document.getElementById('part-kadran'),    initY: 0,   explodeY: -65,  initScale: 0.95, explodeScale: 1.00 },
      { el: document.getElementById('part-mekanizma'), initY: 10,  explodeY: 15,   initScale: 0.95, explodeScale: 1.00 },
      { el: document.getElementById('part-kasa'),      initY: 15,  explodeY: 100,  initScale: 0.98, explodeScale: 0.99 },
      { el: document.getElementById('part-conta'),     initY: 25,  explodeY: 180,  initScale: 0.95, explodeScale: 0.98 },
      { el: document.getElementById('part-kordon'),    initY: 30,  explodeY: 260,  initScale: 0.98, explodeScale: 0.97 }
    ];

    const progressFill  = document.getElementById('progressFill');
    const statusText    = document.getElementById('statusText');
    const stateSubtitle = document.getElementById('stateSubtitle');
    const scrollHint    = document.getElementById('scrollHint');

    let currentP = 0;
    let targetP = 0;

    // Yerel kaydırma miktarını hesapla
    function updateScrollProgress() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll > 0) {
        targetP = Math.max(0, Math.min(1, window.scrollY / maxScroll));
      }
    }

    window.addEventListener('scroll', updateScrollProgress, { passive: true });
    window.addEventListener('resize', updateScrollProgress, { passive: true });

    // Mobil ve masaüstü doğrudan dokunmatik sürükleme desteği
    let isDragging = false;
    let startY = 0;
    let startScroll = 0;

    window.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      startScroll = window.scrollY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const delta = (startY - e.touches[0].clientY) * 2;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, Math.max(0, Math.min(maxScroll, startScroll + delta)));
    }, { passive: true });

    // Render Döngüsü
    function render() {
      requestAnimationFrame(render);

      // Pürüzsüz takip (LERP)
      currentP += (targetP - currentP) * 0.09;
      const p = currentP;

      // Doğal yaylanma eğrisi
      const ease = p * p * (3 - 2 * p);

      // Parçaları dikey eksende milimetrik olarak ayır
      parts.forEach(part => {
        const y = part.initY + (part.explodeY - part.initY) * ease;
        const scale = part.initScale + (part.explodeScale - part.initScale) * ease;
        part.el.style.transform = `translate3d(-50%, calc(-50% + ${y}px), 0) scale(${scale})`;
      });

      const pct = Math.round(p * 100);
      progressFill.style.width = pct + '%';

      scrollHint.style.opacity = p > 0.05 ? '0' : '1';

      if (p < 0.15) {
        statusText.textContent = `BİRLEŞİK (%${pct})`;
        statusText.style.color = '#10b981';
        stateSubtitle.textContent = 'BİRLEŞİK MONTAJLI SAAT';
      } else if (p > 0.8) {
        statusText.textContent = `KATMANLAR AYRILDI (%${pct})`;
        statusText.style.color = '#38bdf8';
        stateSubtitle.textContent = 'KATMANLARINA AYRILMIŞ ANATOMİ';
      } else {
        statusText.textContent = `AYRIŞIYOR (%${pct})`;
        statusText.style.color = '#f59e0b';
        stateSubtitle.textContent = 'MEKANİK KATMAN AYRILMASI';
      }
    }

    updateScrollProgress();
    render();
  </script>
</body>
</html>
